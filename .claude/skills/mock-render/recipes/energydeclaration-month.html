<!DOCTYPE html>
<!-- 能源申報 年度 2025（kWh 柱 + RT·h 線 + kWh/RTh 效率，效率逐月提升）離線模擬渲染 -->
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        html, body { overflow-x: hidden; }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar .nav-link { white-space: nowrap; }
        .navbar-collapse { flex-wrap: nowrap; }

        }

            border: none;

        }

        *, *::before, *::after { transition: none !important; animation: none !important; }
    </style>

    <script>
    // ── 模擬時鐘 ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2025, 11, 31, 10, 0, 0).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        // RT·h 基底與「冷凍噸報表」同一組；kWh = RT·h × 效率比（1.02→0.91 逐月下降＝效率提升）
        // 每 bucket dKwhPerRtHour = dKwh / dRtHour；合計效率 = 總 kWh / 總 RT·h（皆自洽可驗算）
        var ROWS = [
            { szLabel: '2025-01', dRtHour: 28500, ratio: 1.02 },
            { szLabel: '2025-02', dRtHour: 27200, ratio: 1.01 },
            { szLabel: '2025-03', dRtHour: 32800, ratio: 1.00 },
            { szLabel: '2025-04', dRtHour: 41500, ratio: 0.99 },
            { szLabel: '2025-05', dRtHour: 52300, ratio: 0.98 },
            { szLabel: '2025-06', dRtHour: 63800, ratio: 0.97 },
            { szLabel: '2025-07', dRtHour: 71200, ratio: 0.96 },
            { szLabel: '2025-08', dRtHour: 72600, ratio: 0.95 },
            { szLabel: '2025-09', dRtHour: 64100, ratio: 0.94 },
            { szLabel: '2025-10', dRtHour: 51900, ratio: 0.93 },
            { szLabel: '2025-11', dRtHour: 38400, ratio: 0.92 },
            { szLabel: '2025-12', dRtHour: 30700, ratio: 0.91 }
        ];
        var buckets = ROWS.map(function (m) {
            var kwh = Math.round(m.dRtHour * m.ratio);   // 皆為整數（RT·h 整數 × 2 位小數比）
            return {
                dtBucketStart: m.szLabel + '-01T00:00:00',
                szLabel: m.szLabel,
                dKwh: kwh,
                dRtHour: m.dRtHour,
                dKwhPerRtHour: kwh / m.dRtHour,
                isKwhStale: false
            };
        });
        var dTotalKwh = buckets.reduce(function (s, b) { return s + b.dKwh; }, 0);
        var dTotalRt = buckets.reduce(function (s, b) { return s + b.dRtHour; }, 0);

        var QUERY_RESULT = {
            nReportId: 1,
            szReportName: '冷凍系統能效申報',
            szEnergyCircuitName: '冷凍主機總用電',
            szWaterCircuitName: '冷凍主機群',
            nYear: 2025,
            dtStart: '2025-01-01T00:00:00',
            dtEnd: '2026-01-01T00:00:00',
            buckets: buckets,
            dTotalKwh: dTotalKwh,
            dTotalRtHour: dTotalRt,
            dTotalKwhPerRtHour: dTotalKwh / dTotalRt,
            isHasKwhWarning: false,
            isHasRtWarning: false
        };

        var MOCK = {
            '/EnergyDeclaration/api/reports': function () {
                return [
                    { id: 1, name: '冷凍系統能效申報', energyCircuitId: 10, waterCircuitId: 1, sortOrder: 1, description: '冷凍主機總用電 vs 冷凍主機群冷凍噸' }
                ];
            },
            '/EnergyDeclaration/api/circuits': function () {
                return [
                    { id: 10, name: '冷凍主機總用電', parentId: null, sortOrder: 1, sid: '10010' },
                    { id: 11, name: '冰水主機 CH-01 用電', parentId: 10, sortOrder: 1, sid: '10011' },
                    { id: 12, name: '冰水主機 CH-02 用電', parentId: 10, sortOrder: 2, sid: '10012' }
                ];
            },
            '/EnergyDeclaration/api/watercircuits': function () {
                return [
                    { id: 1, name: '冷凍主機群', parentId: null, sortOrder: 1, sid: '20001' },
                    { id: 2, name: '冰水主機 CH-01', parentId: 1, sortOrder: 1, sid: '20002' },
                    { id: 3, name: '冰水主機 CH-02', parentId: 1, sortOrder: 2, sid: '20003' }
                ];
            },
            '/EnergyDeclaration/api/query': function () { return QUERY_RESULT; }
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

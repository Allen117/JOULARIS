     SCENE 由 location.hash 決定：預設 'mcc'（電力盤 MCC-01 全 GOOD 白底）或 --hash ahu（展開空調箱 → AHU-02：GOOD / 過舊黃底 / STALE / BAD 紅底 / NO_DATA 灰底對照）。
     點位資料在 POINTS（[sid, 名稱, 數值, 單位, 品質, 秒數前]），列底色規則照 RealtimeDataItemModel.GetCssRowClass；
     mock /api/realtime/latest 回同一份資料（1 秒後 realtime.js 首次輪詢會 merge，不改畫面） -->

    var POINTS = [
        // 電力盤 MCC-01（Coordinator 1，單站號）
        ['65793-S1', '電壓 R-S', 381.25, 'V', 'GOOD', 2],
        ['65793-S2', '電壓 S-T', 380.86, 'V', 'GOOD', 2],
        ['65793-S3', '電壓 T-R', 382.07, 'V', 'GOOD', 2],
        ['65793-S4', '電流 R 相', 152.43, 'A', 'GOOD', 2],
        ['65793-S5', '電流 S 相', 149.88, 'A', 'GOOD', 2],
        ['65793-S6', '電流 T 相', 151.06, 'A', 'GOOD', 2],
        ['65793-S7', '有效功率', 94.62, 'kW', 'GOOD', 2],
        ['65793-S8', '功率因數', 0.946, 'PF', 'GOOD', 2],
        ['65793-S9', '頻率', 59.98, 'Hz', 'GOOD', 2],
        ['65793-S10', '累積電度', 1285643.5, 'kWh', 'GOOD', 2],
        // 空調箱 AHU-01 / AHU-02（Coordinator 2，雙站號）
        ['131329-S1', '運轉狀態', 1, '', 'GOOD', 3],
        ['131329-S2', '故障狀態', 0, '', 'GOOD', 3],
        ['131329-S3', '回風溫度', 25.4, '℃', 'GOOD', 3],
        ['131329-S4', '送風溫度', 16.8, '℃', 'GOOD', 3],
        ['131329-S5', '回風濕度', 58.2, '%', 'GOOD', 3],
        ['131329-S6', '風機頻率', 45.0, 'Hz', 'GOOD', 3],
        ['131585-S1', '運轉狀態', 1, '', 'GOOD', 4],
        ['131585-S2', '故障狀態', 0, '', 'GOOD', 4],
        ['131585-S3', '回風溫度', 26.1, '℃', 'GOOD', 95],
        ['131585-S4', '送風溫度', 17.3, '℃', 'STALE', 412],
        ['131585-S5', '回風濕度', 0, '%', 'BAD', 4],
        ['131585-S6', '風機頻率', 42.5, 'Hz', 'GOOD', 4],
        ['131585-S7', '冰水閥開度', 63.0, '%', 'GOOD', 4],
        ['131585-S8', '濾網壓差', null, 'Pa', 'NO_DATA', 0],
        // 冰水泵 P-01 ~ P-03（Coordinator 3，三站號）
        ['196865-S1', '運轉狀態', 1, '', 'GOOD', 2], ['196865-S2', '運轉頻率', 48.5, 'Hz', 'GOOD', 2],
        ['197121-S1', '運轉狀態', 1, '', 'GOOD', 2], ['197121-S2', '運轉頻率', 48.5, 'Hz', 'GOOD', 2],
        ['197377-S1', '運轉狀態', 0, '', 'GOOD', 2], ['197377-S2', '運轉頻率', 0, 'Hz', 'GOOD', 2],
        // 環境感測（Coordinator 4）
        ['262401-S1', '外氣溫度', 31.2, '℃', 'GOOD', 5], ['262401-S2', '外氣濕度', 66.0, '%', 'GOOD', 5],
        // DB 來源
        ['DB1-S1', '契約容量', 1200, 'kW', 'GOOD', 30], ['DB1-S2', '本月最高需量', 986.4, 'kW', 'GOOD', 30],
        // 計算點位
        ['CALC-S1', '冰水泵總頻率', 97.0, 'Hz', 'GOOD', 2], ['CALC-S2', '空調總用電', 58.3, 'kW', 'GOOD', 2]
    ];
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function fmtTs(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
    function buildRealtimeData() {
        var now = Date.now();
        return POINTS.map(function (p) {
            var hasData = p[2] !== null, q = p[4], isRecent = p[5] <= 60;
            var isDb = p[0].indexOf('DB') === 0;
            var css = !hasData ? 'row-nodata'
                : q === 'STALE' ? 'row-outdated table-warning'
                : q !== 'GOOD' ? 'row-error table-danger'
                : (!isRecent && !isDb) ? 'row-outdated table-warning' : 'row-recent';
            var badge = ({ GOOD: 'bg-success', UNCERTAIN: 'bg-warning', BAD: 'bg-danger', STALE: 'bg-warning' })[q] || 'bg-secondary';
            return {
                subTopic: p[0], sid: p[0], name: p[1],
                value: hasData ? Number(p[2]).toFixed(3) : '--', unit: p[3], quality: q,
                timestamp: hasData ? fmtTs(new Date(now - p[5] * 1000)) : '--',
                isRecent: isRecent, cssClass: css, badgeClass: badge
            };
        });
    }
    window.i18n = { t: function (k, a) { return ({
        'realtime.connection.ok': '連線正常', 'realtime.connection.bad': '連線異常',
        'realtime.footer.last_update': '最後更新', 'realtime.empty.no_data': '尚無即時資料，請確認 MQTT 連線狀態'
    })[k] || k; } };
    </script>

    <script>
    // ── 模擬時鐘：固定頁面時間（要換日期/時刻改這一行） ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        var MOCK = {
            '/api/realtime/latest': function () {
                return { success: true, timestamp: fmtTs(new Date()), connectionStatus: true, data: buildRealtimeData() };
            },
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path](String(url), opts)), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
    // ── 模擬時鐘 ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        // 2026/1~2026/8 vs 2025 同期（去年同期比較）
        // 自洽：合計 = 各月加總；差異合計 = 本期合計 − 去年合計
        var MONTHS = [
            { szLabel: '2026-01', dKwh: 412560, dLastYearKwh: 398220 },
            { szLabel: '2026-02', dKwh: 358920, dLastYearKwh: 372610 },
            { szLabel: '2026-03', dKwh: 445180, dLastYearKwh: 421050 },
            { szLabel: '2026-04', dKwh: 468300, dLastYearKwh: 452880 },
            { szLabel: '2026-05', dKwh: 512740, dLastYearKwh: 495300 },
            { szLabel: '2026-06', dKwh: 587920, dLastYearKwh: 548760 },
            { szLabel: '2026-07', dKwh: 634510, dLastYearKwh: 602140 },
            { szLabel: '2026-08', dKwh: 621880, dLastYearKwh: 640350 }
        ];
        var buckets = MONTHS.map(function (m) {
            var diff = m.dKwh - m.dLastYearKwh;
            var pct = m.dLastYearKwh ? diff / Math.abs(m.dLastYearKwh) * 100 : null;
            return {
                dtBucketStart: m.szLabel + '-01T00:00:00',
                szLabel: m.szLabel,
                dKwh: m.dKwh,
                isStale: false,
                dLastYearKwh: m.dLastYearKwh,
                dDiffKwh: diff,
                dPctChange: pct
            };
        });
        var dTotal = buckets.reduce(function (s, b) { return s + b.dKwh; }, 0);

        var QUERY_RESULT = {
            nCircuitId: 1,
            szCircuitName: '總表',
            szGranularity: 'month',
            dtStart: '2026-01-01T00:00:00',
            dtEnd: '2026-08-31T23:59:59',
            buckets: buckets,
            dTotalKwh: dTotal,
            isHasWarning: false,
            isYoy: true,
            children: []
        };

        var MOCK = {
            '/EnergyReport/api/circuits': function () {
                return [
                    { id: 1, name: '總表', parentId: null, sortOrder: 1, sid: '10001' },
                    { id: 2, name: '空調系統', parentId: 1, sortOrder: 1, sid: '10002' },
                    { id: 3, name: '動力設備', parentId: 1, sortOrder: 2, sid: '10003' },
                    { id: 4, name: '照明插座', parentId: 1, sortOrder: 3, sid: '10004' },
                    { id: 5, name: '冰水主機群', parentId: 1, sortOrder: 4, sid: '10005' }
                ];
            },
            '/EnergyReport/api/query': function () { return QUERY_RESULT; },
            '/BillingPeriodSetting/api/current': function () {
                return { start: '2026-08-01', end: '2026-08-31' };
            },
            '/BillingPeriodSetting/api/range': function () {
                return [
                    { start: '2026-01-01', end: '2026-01-31' },
                    { start: '2026-08-01', end: '2026-08-31' }
                ];
            }
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script src="{{WWWROOT}}/js/energyreport.js"></script>
    <script>
        window._erInit = { today: '2026-09-09' };
        // 自動驅動：切月粒度 + 設 2026/01~2026/08 + 選迴路 + 觸發查詢
        (function () {
            function drive() {
                var g = document.getElementById('erGranularity');
                g.value = 'month';
                g.dispatchEvent(new Event('change'));
                document.getElementById('erMonthStart').value = '2026-01';
                document.getElementById('erMonthEnd').value = '2026-08';
                var yoy = document.getElementById('erYoy');
                if (yoy) yoy.checked = true;
                var sel = document.getElementById('erCircuit');
                // 等迴路下拉載入完（有真正 value 的 option）
                var opt = Array.prototype.find.call(sel.options, function (o) { return o.value === '1'; });
                if (!opt) { setTimeout(drive, 60); return; }
                sel.value = '1';
                window._er.query();
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () { setTimeout(drive, 80); });
            } else {
                setTimeout(drive, 80);
            }
        })();
    </script>

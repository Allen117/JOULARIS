                        <option value="day" selected>日</option>
                        <option value="month">月</option>
                        <option value="year">年</option>
                        <option value="shift">班別</option>
                    </select>
                </div>

                <!-- 時粒度：起訖時（日期 + 0~23 時，無分鐘） -->
                <div class="gur-wide-date gur-period gur-period-hour">
                    <label class="form-label fw-semibold"><i class="fas fa-calendar-day me-1"></i>起時</label>

        </div>
    </div>

                if (!Array.prototype.some.call(sel.options, function (o) { return o.value === '1'; })) { setTimeout(drive, 60); return; }
                var g = document.getElementById('gurGranularity');
                g.value = 'month'; g.dispatchEvent(new Event('change'));
                var a = document.getElementById('gurMonthStart'), b = document.getElementById('gurMonthEnd');
                a.value = '2025-01'; b.value = '2025-12'; b.dispatchEvent(new Event('change'));
                sel.value = '1';
                window._gur.query();
            }
            document.addEventListener('DOMContentLoaded', function () { setTimeout(drive, 80); });
        })();
    </script>

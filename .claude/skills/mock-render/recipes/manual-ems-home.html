<!DOCTYPE html>
<!-- Recipe: /EMS 首頁（EMS 綠）— 電力五卡（MainMeter / Demand / EnergyBar / EnergyPie / Yoy）
     改數字只需動 <head> 的 MOCK 物件與 buildTrend() 控制點。API 形狀（與 EmsController 一致）：
       /EMS/api/main-meter-info    {hasMainMeter, mode:'aggregated', name, voltage|current|power|powerFactor:{unit}}  unit 空字串=不顯示
       /EMS/api/main-meter-values  {voltage, current, power, powerFactor}  V/I/P toFixed(2)、PF toFixed(3)
       /EMS/api/main-meter         {hasMainMeter, id, name, hasChildren}
       /EMS/api/demand-circuits    [{id, name}]
       /EMS/api/demand-today       {hasData, currentKW, maxKW, maxAt:'HH:mm', quality:1}  quality=1 綠點、0 黃點
       /EMS/api/demand-trend       [{t:'HH:mm', v, q}] 每分鐘一點，只給到「現在」（buildTrend 產生）
       /EMS/api/circuit-energy     {labels:['00:00'...], values:[kWh]}  未來時段給 0
       /EMS/api/main-meter-breakdown {hasMainMeter, meterName, items:[{id,name,kwh}]}  負值不入餅
       /EMS/api/main-meter-yoy     {hasMainMeter, rows:[{id,name,isMainMeter,currentKwh,lastYearKwh,diffKwh,pctChange}]}  正=紅▲ 負=綠▼ null=--
     注意：假數字要自洽（餅合計=總表=長條加總；子項 diff 加總=總表 diff）。契約容量在此頁無 UI 欄位。 -->

    <script>
    // ── 模擬時鐘：固定 2026-09-09 15:42:10 ─────────────────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，餵前端與正式後端相同格式的假資料 ──
    (function () {
        var NOW_MIN = 15 * 60 + 42; // 15:42

        function pad2(n) { return n < 10 ? '0' + n : String(n); }

        // 今日需量曲線（每分鐘一點）：夜間基載 ~390 kW，白天雙峰，
        // 最高 918.4 kW (11:20)，目前 825.0 kW
        function buildTrend() {
            var ctrl = [
                [0, 398], [120, 388], [300, 392], [390, 432], [450, 540],
                [480, 645], [540, 762], [600, 851], [650, 896], [680, 918.4],
                [700, 881], [750, 731], [770, 712], [810, 781], [870, 846],
                [900, 861], [920, 839], [942, 825]
            ];
            var pts = [];
            for (var m = 0; m <= NOW_MIN; m++) {
                var i = 0;
                while (i < ctrl.length - 1 && ctrl[i + 1][0] < m) i++;
                var a = ctrl[i], b = ctrl[Math.min(i + 1, ctrl.length - 1)];
                var v = (b[0] === a[0]) ? a[1]
                    : a[1] + (b[1] - a[1]) * (m - a[0]) / (b[0] - a[0]);
                v += Math.sin(m * 0.73) * 3.5 + Math.sin(m * 0.171) * 2.2; // 自然抖動
                if (m !== 680) v = Math.min(v, 917.2);
                if (m === 680) v = 918.4;
                if (m === NOW_MIN) v = 825.0;
                pts.push({ t: pad2(Math.floor(m / 60)) + ':' + pad2(m % 60), v: Math.round(v * 10) / 10, q: 1 });
            }
            return pts;
        }

        var HOUR_LABELS = [], HOUR_VALUES = [
            396.2, 390.5, 386.1, 391.4, 401.8, 428.3, 537.6, 703.9,
            806.2, 871.5, 900.8, 888.4, 752.1, 741.6, 829.3, 578.4,
            0, 0, 0, 0, 0, 0, 0, 0
        ];
        for (var h = 0; h < 24; h++) HOUR_LABELS.push(pad2(h) + ':00');

        var MOCK = {
            '/EMS/api/main-meter-info': function () {
                return {
                    hasMainMeter: true,
                    mode: 'aggregated',
                    name: '總表用電',
                    voltage: { unit: 'kV' },
                    current: { unit: 'A' },
                    power: { unit: 'kW' },
                    powerFactor: { unit: '' }
                };
            },
            '/EMS/api/main-meter-values': function () {
                // 11.4 kV、825 kW、PF 0.95 → I = P / (√3·V·PF) ≈ 44.01 A
                return { voltage: 11.4, current: 44.01, power: 825.0, powerFactor: 0.95 };
            },
            '/EMS/api/demand-circuits': function () {
                return [
                    { id: 1, name: '總表用電' },
                    { id: 2, name: '空調系統用電' },
                    { id: 3, name: '動力設備用電' },
                    { id: 4, name: '照明插座用電' }
                ];
            },
            '/EMS/api/main-meter': function () {
                return { hasMainMeter: true, id: 1, name: '總表用電', hasChildren: true };
            },
            '/EMS/api/demand-today': function () {
                return { hasData: true, currentKW: 825.0, maxKW: 918.4, maxAt: '11:20', quality: 1 };
            },
            '/EMS/api/demand-trend': buildTrend,
            '/EMS/api/circuit-energy': function () {
                return { labels: HOUR_LABELS, values: HOUR_VALUES };
            },
            '/EMS/api/main-meter-breakdown': function () {
                return {
                    hasMainMeter: true,
                    meterName: '總表用電',
                    items: [
                        { id: 2, name: '空調系統用電', kwh: 4652.3 },
                        { id: 3, name: '動力設備用電', kwh: 3781.2 },
                        { id: 4, name: '照明插座用電', kwh: 1570.6 }
                    ]
                };
            },
            '/EMS/api/main-meter-yoy': function () {
                return {
                    hasMainMeter: true,
                    rows: [
                        { id: 1, name: '總表用電',   isMainMeter: true,  currentKwh: 10004.1, lastYearKwh: 10668.4, diffKwh: -664.3, pctChange: -6.2 },
                        { id: 2, name: '空調系統用電', isMainMeter: false, currentKwh: 4652.3,  lastYearKwh: 4887.5,  diffKwh: -235.2, pctChange: -4.8 },
                        { id: 3, name: '動力設備用電', isMainMeter: false, currentKwh: 3781.2,  lastYearKwh: 3985.1,  diffKwh: -203.9, pctChange: -5.1 },
                        { id: 4, name: '照明插座用電',  isMainMeter: false, currentKwh: 1570.6,  lastYearKwh: 1795.8,  diffKwh: -225.2, pctChange: -12.5 }
                    ]
                };
            }
        };

        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
        (function () {
            function updateClock() {
                var now = new Date();
                var pad = function (n) { return n.toString().padStart(2, '0'); };
                var s = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
                    ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
                var el = document.getElementById('serverClock');
                if (el) el.textContent = s;
            }
            updateClock();
            setInterval(updateClock, 1000);
        })();
    </script>

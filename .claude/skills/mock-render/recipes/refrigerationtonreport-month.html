    <script>
    // ── 模擬時鐘 ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2025, 11, 31, 10, 0, 0).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        // 冷凍噸月粒度 2025 全年（季節型、YoY 穩定的冷量需求）
        // dTotalRtHour = 各月 dRtHour 加總（頁面會顯示合計，使用者可驗算）
        var RT = [
            { szLabel: '2025-01', dRtHour: 28500 },
            { szLabel: '2025-02', dRtHour: 27200 },
            { szLabel: '2025-03', dRtHour: 32800 },
            { szLabel: '2025-04', dRtHour: 41500 },
            { szLabel: '2025-05', dRtHour: 52300 },
            { szLabel: '2025-06', dRtHour: 63800 },
            { szLabel: '2025-07', dRtHour: 71200 },
            { szLabel: '2025-08', dRtHour: 72600 },
            { szLabel: '2025-09', dRtHour: 64100 },
            { szLabel: '2025-10', dRtHour: 51900 },
            { szLabel: '2025-11', dRtHour: 38400 },
            { szLabel: '2025-12', dRtHour: 30700 }
        ];
        var buckets = RT.map(function (m) {
            return {
                dtBucketStart: m.szLabel + '-01T00:00:00',
                szLabel: m.szLabel,
                dRtHour: m.dRtHour
            };
        });
        var dTotal = buckets.reduce(function (s, b) { return s + b.dRtHour; }, 0);

        var QUERY_RESULT = {
            nCircuitId: 1,
            szCircuitName: '冷凍主機群',
            szGranularity: 'month',
            dtStart: '2025-01-01T00:00:00',
            dtEnd: '2026-01-01T00:00:00',
            buckets: buckets,
            dTotalRtHour: dTotal,
            isHasWarning: false,
            coverage: {
                nExpectedHours: 8760, nActualHours: 8760, dCoveragePercent: 100.0,
                nMissingHours: 0, szWorstLeafName: '', nThresholdPercent: 90, isBelowThreshold: false
            },
            children: []
        };

        var MOCK = {
            '/RefrigerationTonReport/api/circuits': function () {
                return [
                    { id: 1, name: '冷凍主機群', parentId: null, sortOrder: 1, sid: '20001' },
                    { id: 2, name: '冰水主機 CH-01', parentId: 1, sortOrder: 1, sid: '20002' },
                    { id: 3, name: '冰水主機 CH-02', parentId: 1, sortOrder: 2, sid: '20003' }
                ];
            },
            '/RefrigerationTonReport/api/query': function () { return QUERY_RESULT; }
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
        window._rtInit = { today: '2025-12-31' };
        // 自動驅動：切月粒度 + 設 2025/01~2025/12 + 選迴路 + 觸發查詢
        (function () {
            function drive() {
                var g = document.getElementById('rtGranularity');
                g.value = 'month';
                g.dispatchEvent(new Event('change'));
                document.getElementById('rtMonthStart').value = '2025-01';
                document.getElementById('rtMonthEnd').value = '2025-12';
                var sel = document.getElementById('rtCircuit');
                var opt = Array.prototype.find.call(sel.options, function (o) { return o.value === '1'; });
                if (!opt) { setTimeout(drive, 60); return; }
                sel.value = '1';
                window._rt.query();
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () { setTimeout(drive, 80); });
            } else {
                setTimeout(drive, 80);
            }
        })();
    </script>

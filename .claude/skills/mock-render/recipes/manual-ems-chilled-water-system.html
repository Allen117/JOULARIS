<div class="modal fade" id="circuitModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title"><i class="fas fa-edit me-1"></i><span id="modalTitle">新增迴路</span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cwId">
                <input type="hidden" id="cwParentId">

                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="fas fa-tag me-1"></i>名稱</label>
                    <input type="text" class="form-control form-control-sm" id="cwName" placeholder="例如：空調水系統 / 冰機 1">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="fas fa-cog me-1"></i>節點類型</label>
                    <div class="btn-group btn-group-sm w-100" role="group">
                        <input type="radio" class="btn-check" name="cwType" id="cwTypeVirtual" value="virtual" checked>
                        <label class="btn btn-outline-primary" for="cwTypeVirtual">
                            <i class="fas fa-folder me-1"></i>虛擬迴路
                        </label>
                        <input type="radio" class="btn-check" name="cwType" id="cwTypePoint" value="point">
                        <label class="btn btn-outline-primary" for="cwTypePoint">
                            <i class="fas fa-snowflake me-1"></i>實體點位
                        </label>
                    </div>
                </div>

                <div class="mb-3" id="cwPointFields" style="display:none;">
                    <label class="form-label fw-semibold"><i class="fas fa-server me-1"></i>通訊設備</label>
                    <select class="form-select form-select-sm" id="cwDevice">
                        <option value="">-- 請選擇設備 --</option>
                    </select>

                    <label class="form-label fw-semibold mt-3"><i class="fas fa-plug me-1"></i>對應點位</label>
                    <select class="form-select form-select-sm" id="cwSid" disabled>
                        <option value="">-- 請先選擇設備 --</option>

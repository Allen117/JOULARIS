    <script>
    // ── 模擬時鐘：固定頁面時間（要換日期/時刻改這一行） ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        var MOCK = {
            // '/Xxx/api/yyy': function () { return { ... }; },
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();

<script>
// fetch mock：window.__MOCK[path] = function (url, opts) { return json; }（handler 拿得到 query / body）
(function () {
    var realFetch = window.fetch;
    window.fetch = function (url, opts) {
        var path = String(url).split('?')[0];
        var h = (window.__MOCK || {})[path];
        if (h) return Promise.resolve(new Response(JSON.stringify(h(String(url), opts || {})), { status: 200, headers: { 'Content-Type': 'application/json' } }));
        return realFetch.apply(this, arguments);
    };
})();
</script>
<script>

// 總表 2026/01~08 逐月 kWh（與用電報表 recipe 同一組數字）× 平均單價（夏月 6~8 月較高）→ 電費；合計 = 各月加總
var MONTHS = ['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
var KWH    = [412560, 358920, 445180, 468300, 512740, 587920, 634510, 621880];
var RATE   = [3.92, 3.88, 3.95, 3.97, 4.21, 4.86, 4.93, 4.91];
window.__MOCK = {
  '/BillingPeriodSetting/api/current': function () { return { start: '2026-08-01', end: '2026-08-31' }; },
  '/BillingPeriodSetting/api/range': function () { return [{ start: '2026-01-01', end: '2026-01-31' }, { start: '2026-08-01', end: '2026-08-31' }]; },
  '/ElectricityCostReport/api/circuits': function () {
    return [
      { id: 1, parentId: null, name: '總表', sid: '1-S1', sortOrder: 1 },
      { id: 2, parentId: 1, name: '空調系統', sid: '1-S2', sortOrder: 1 },
      { id: 3, parentId: 1, name: '動力設備', sid: '1-S3', sortOrder: 2 },
      { id: 4, parentId: 1, name: '照明插座', sid: '1-S4', sortOrder: 3 }
    ];
  },
  '/ElectricityCostReport/api/query': function () {
    var buckets = MONTHS.map(function (m, i) { return { label: m, kwh: KWH[i], cost: Math.round(KWH[i] * RATE[i] * 10) / 10 }; });
    var tk = 0, tc = 0; buckets.forEach(function (b) { tk += b.kwh; tc += b.cost; });
    return { hasData: true, circuitName: '總表', isEstimated: false, buckets: buckets, totalKwh: tk, totalCost: Math.round(tc * 10) / 10 };
  }
};
</script>

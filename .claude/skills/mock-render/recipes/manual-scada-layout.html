<!DOCTYPE html>

     ④ 在 PAGE_SCRIPTS 掛頁面 JS（Chart.js 已含，不用的頁面可移除該行） -->
<html lang="zh-TW">

    <!-- 與 _Layout.cshtml 同步的自訂樣式 -->
    <style>
        html, body { overflow-x: hidden; }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .navbar .nav-link { white-space: nowrap; }
        .navbar-collapse { flex-wrap: nowrap; }
        .footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 8px 0;

        }

        .footer-logo-word { fill: #ffffff; font: 800 56px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 3px; }
        .footer-logo-star { fill: #e0e7ff; }
        .footer-logo-spark { fill: #c7d2fe; }
        main { min-height: calc(100vh - 140px); }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .btn-primary { background: linear-gradient(45deg, #007bff, #0056b3); border: none; }
        .text-primary { color: #007bff !important; }
        *, *::before, *::after { transition: none !important; animation: none !important; }
        /* 情境切換：body[data-scene] = nav | search | denied（由 URL hash 決定） */
        body[data-scene="nav"] main, body[data-scene="nav"] footer { display: none !important; }
        body[data-scene="nav"] { min-height: 0; background: #fff; }
        body[data-scene="nav"] .navbar { position: relative; }
        .anno { position: absolute; border: 3px solid #dc3545; border-radius: 8px; pointer-events: none; }
        .anno-label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: #dc3545; color: #fff; font-weight: 700; font-size: 15px; padding: 3px 12px; border-radius: 12px; white-space: nowrap; }
        .nav-stage { padding: 0 0 56px; background: #fff; }
        body:not([data-scene="denied"]) .scene-denied { display: none !important; }
        body:not([data-scene="search"]) .scene-search { display: none !important; }
    </style>

    <script>
    // ── 模擬時鐘：固定頁面時間（要換日期/時刻改這一行） ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        function E(route, zh, en, icon, kw) { return { szRoute: route, szTitleZh: zh, szTitleEn: en, szIcon: icon, szKeywords: kw, isEms: EMS.indexOf(route) >= 0 }; }
        var EMS = ['/EnergyReport', '/ElectricityCostReport', '/WaterUsageReport', '/DailyReport', '/EnergyDeclaration'];
        // 形狀同 GlobalSearchController.GetIndex → { entries: [...] }；標題取自 _Layout resx
        var INDEX = [
            E('/ScadaPage', '即時監控', 'SCADA Page', 'fas fa-desktop', '圖控 監控 首頁 畫面 mimic dashboard monitor'),
            E('/RealTime', '即時數據', 'Realtime Data', 'fas fa-tachometer-alt', '即時 數據 點位 realtime data point'),
            E('/ConditionCtrl', '條件控制', 'Condition Control', 'fas fa-code-branch', '條件 控制 邏輯 condition control'),
            E('/ScheduleSetting', '排程設定', 'Schedule', 'fas fa-calendar-alt', '排程 時程 控制 schedule timer'),
            E('/HistoryData', '趨勢圖', 'Trend', 'fas fa-chart-area', '歷史 趨勢 曲線 history trend chart'),
            E('/EventLog', '事件記錄', 'Event Log', 'fas fa-clipboard-list', '事件 記錄 日誌 警報歷史 event log'),
            E('/AlarmSetting', '警報設定', 'Alarm Settings', 'fas fa-bell', '警報 通知 line email 推播 alarm notify'),
            E('/WeatherSetting', '氣象資料', 'Weather Data', 'fas fa-cloud-sun', '氣象 天氣 溫度 weather'),
            E('/AccountSetting', '帳號管理', 'Account Management', 'fas fa-users-cog', '帳號 使用者 權限 密碼 account user permission'),
            E('/EnergyReport', '用電報表', 'Energy Report', 'fas fa-chart-bar', '報表 用電 電力 度數 kwh power electricity usage report'),
            E('/ElectricityCostReport', '電費報表', 'Electricity Cost Report', 'fas fa-file-invoice-dollar', '報表 電費 帳單 金額 bill cost report'),
            E('/WaterUsageReport', '用水報表', 'Water Usage Report', 'fas fa-water', '報表 用水 水量 water usage report'),
            E('/DailyReport', '能源日報', 'Daily Energy Report', 'fas fa-newspaper', '日報 能源 每日 摘要 daily report summary email'),
            E('/EnergyDeclaration', '能源申報', 'Energy Declaration', 'fas fa-file-signature', '能源 申報 報表 declaration')
        ];
        var MOCK = {
            '/api/globalsearch/index': function () { return { entries: INDEX }; }
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
        window.i18n = { currentCulture: function () { return 'zh-TW'; }, t: function (k) { return ({
            'layout.search.no_result': '找不到符合的頁面', 'layout.search.recent': '最近使用',
            'layout.search.error': '搜尋索引載入失敗，請重新整理頁面' })[k] || k; } };
        try { localStorage.removeItem('scadaGlobalSearchFreq'); } catch (e) {}
        var SCENE = (location.hash || '#nav').substring(1);   // nav / search / denied（render_page.py --hash search / denied 切換）
        document.body.setAttribute('data-scene', SCENE);
    </script>
    <script src="{{WWWROOT}}/js/global-search.js"></script>
    <script>
        // 情境 nav：導覽列兩組紅框標註
        function annotate() {
            var nav = document.querySelector('.navbar');
            var wrap = document.createElement('div'); wrap.className = 'nav-stage';
            nav.parentNode.insertBefore(wrap, nav); wrap.appendChild(nav);
            var nr = nav.getBoundingClientRect();
            function box(elA, elB, label) {
                var a = elA.getBoundingClientRect(), b = elB.getBoundingClientRect();
                var d = document.createElement('div'); d.className = 'anno';
                d.style.left = (a.left - 6) + 'px'; d.style.top = (nr.top + 6) + 'px';
                d.style.width = (b.right - a.left + 12) + 'px'; d.style.height = (nr.height - 12) + 'px';
                d.innerHTML = '<span class="anno-label">' + label + '</span>';
                nav.appendChild(d);
            }
            var left = document.querySelectorAll('.navbar-nav.me-auto > li');
            var right = document.querySelectorAll('.navbar-nav.ms-auto > li');
            box(left[0], left[left.length - 1], '左側功能選單');
            box(right[0], right[right.length - 1], '右側工具列');
        }
        document.addEventListener('DOMContentLoaded', function () {
            if (SCENE === 'nav') annotate();
            if (SCENE === 'search') {
                var inp = document.getElementById('globalSearchInput');
                inp.value = '報表';
                window._globalSearch.open();
            }
        });
    </script>

<!DOCTYPE html>
<!-- Recipe: /ElectricityCircuitInfo 電力迴路用電資訊（EMS 綠）— 左迴路樹（總表 + 五個子迴路）
     右三卡：年(各月 kWh) / 月(各日 kWh) / 日(各時 kWh)。預設選總表；驅動 pivot 到完整期間：
       年=2025 全 12 月、月=2026-08 全 31 日、日=2026-09-08 全 24 時。
     API：/EMS/api/circuit-tree [{id,name,parentId,sortOrder}]
          /EMS/api/circuit-energy?granularity=month|day|hour&pivot=... → {labels,values}
          label 格式：month→yyyy-MM、day→MM/dd、hour→HH:00（同 EnergyReportService.BuildLabels） -->
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電力迴路資訊 - SCADA 監控系統</title>

        .footer-logo { height: 22px; width: auto; display: block; }

        .footer-logo-star { fill: #e0e7ff; }

    </style>

    <script>
    // ── 模擬時鐘：固定 2026-09-09 15:42:10 ─────────────────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，餵前端與正式後端相同格式的假資料 ──
    (function () {
        function pad2(n) { return n < 10 ? '0' + n : String(n); }

        // 年（各月 kWh）：2025 全 12 月，辦公型夏高冬低
        var YEAR_LABELS = [];
        for (var mo = 1; mo <= 12; mo++) YEAR_LABELS.push('2025-' + pad2(mo));
        var YEAR_VALUES = [468000, 412000, 476000, 498000, 552000, 628000,
                           704000, 690000, 596000, 534000, 486000, 492000];

        // 月（各日 kWh）：2026-08 全 31 日，平日高、週末低（Aug 2026：1=六）
        // 週末索引（1-based 日）：1,2,8,9,15,16,22,23,29,30
        var WEEKEND = { 1:1, 2:1, 8:1, 9:1, 15:1, 16:1, 22:1, 23:1, 29:1, 30:1 };
        var WEEKDAY_KWH = [22800, 23600, 24100, 23400, 22900, 23200, 24000, 24600,
                           23800, 23100, 22700, 23900, 24400, 23700, 23000, 22600,
                           23500, 24200, 23600, 22800, 22500];
        var WEEKEND_KWH = [12800, 11500, 13100, 11900, 12600, 11700, 13000, 12100, 12900, 11600];
        var MONTH_LABELS = [], MONTH_VALUES = [];
        var wdIdx = 0, weIdx = 0;
        for (var d = 1; d <= 31; d++) {
            MONTH_LABELS.push('08/' + pad2(d));
            if (WEEKEND[d]) { MONTH_VALUES.push(WEEKEND_KWH[weIdx++]); }
            else { MONTH_VALUES.push(WEEKDAY_KWH[wdIdx++]); }
        }

        // 日（各時 kWh）：2026-09-08 全 24 時，辦公型單峰（11 時尖峰 ~1,135）
        var HOUR_LABELS = [];
        for (var h = 0; h < 24; h++) HOUR_LABELS.push(pad2(h) + ':00');
        var HOUR_VALUES = [402, 388, 380, 384, 396, 440, 560, 760,
                           940, 1060, 1120, 1135, 1030, 1045, 1085, 1060,
                           1015, 940, 720, 620, 560, 510, 468, 430];

        var MOCK = {
            '/EMS/api/circuit-tree': function () {
                return [
                    { id: 1, name: '總表',            parentId: null, sortOrder: 1 },
                    { id: 2, name: '空調系統',            parentId: 1,    sortOrder: 1 },
                    { id: 3, name: '照明插座',   parentId: 1,    sortOrder: 2 },
                    { id: 4, name: '給排水設備',        parentId: 1,    sortOrder: 3 },
                    { id: 5, name: '其他負載',            parentId: 1,    sortOrder: 4 },
                    { id: 6, name: '動力設備',   parentId: 1,    sortOrder: 5 }
                ];
            },
            '/EMS/api/circuit-energy': function (url) {
                var qs = String(url).split('?')[1] || '';
                var m = qs.match(/granularity=([^&]+)/);
                var g = m ? m[1] : 'hour';
                if (g === 'month') return { labels: YEAR_LABELS, values: YEAR_VALUES };
                if (g === 'day')   return { labels: MONTH_LABELS, values: MONTH_VALUES };
                return { labels: HOUR_LABELS, values: HOUR_VALUES };
            }
        };

        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path](url)), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

    <script>
        // 驅動：在 ems-circuit.js 的 init 之後、tree 選取（微任務）之前把 pivot 改成完整期間，
        // 使 loadAllCharts 讀到 2025 全年 / 2026-08 全月 / 2026-09-08 全日

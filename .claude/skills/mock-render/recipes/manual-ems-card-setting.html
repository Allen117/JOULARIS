    <script>
    // ── 模擬時鐘：固定頁面時間（要換日期/時刻改這一行） ─────────
    (function () {
        var RealDate = Date;
        var target = new RealDate(2026, 8, 9, 15, 42, 10).getTime();
        var offset = target - RealDate.now();
        function MockDate() {
            if (arguments.length === 0) return new RealDate(RealDate.now() + offset);
            return new (Function.prototype.bind.apply(RealDate, [null].concat([].slice.call(arguments))))();
        }
        MockDate.prototype = RealDate.prototype;
        MockDate.now = function () { return RealDate.now() + offset; };
        MockDate.parse = RealDate.parse;
        MockDate.UTC = RealDate.UTC;
        window.Date = MockDate;
    })();

    // ── 模擬 API：攔截 fetch，key = 去掉 query string 的路徑 ──────
    (function () {
        var MOCK = {
            // '/Xxx/api/yyy': function () { return { ... }; },
        };
        var realFetch = window.fetch;
        window.fetch = function (url, opts) {
            var path = String(url).split('?')[0];
            if (MOCK[path]) {
                return Promise.resolve(new Response(JSON.stringify(MOCK[path]()), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                }));
            }
            return realFetch.apply(this, arguments);
        };
    })();
    </script>

<script>
// fetch mock：window.__MOCK[path] = function (url, opts) { return json; }（handler 拿得到 query / body）
(function () {
    var realFetch = window.fetch;
    window.fetch = function (url, opts) {
        var path = String(url).split('?')[0];
        var h = (window.__MOCK || {})[path];
        if (h) return Promise.resolve(new Response(JSON.stringify(h(String(url), opts || {})), { status: 200, headers: { 'Content-Type': 'application/json' } }));
        return realFetch.apply(this, arguments);
    };
})();
</script>
<script>

// 卡片清單形狀照 EmsCardSettingController.GetCards；定義照 EmsCardRegistry（gridCss / icon 必須一致）
var DEF = [
  ['MainMeter','emscard.name.mainmeter','col-12','fa-star'],
  ['Demand','emscard.name.demand','col-md-6 col-lg-5 col-xl-4','fa-tachometer-alt'],

  ['Cost','emscard.name.cost','col-md-6 col-lg-5 col-xl-4','fa-file-invoice-dollar'],
  ['CostYoy','emscard.name.costyoy','col-md-6 col-lg-7 col-xl-8','fa-scale-balanced'],
  ['WaterUsagePie','emscard.name.waterusagepie','col-md-6 col-lg-5 col-xl-4','fa-chart-pie'],
  ['WaterUsageBar','emscard.name.waterusagebar','col-md-6 col-lg-7 col-xl-8','fa-chart-bar'],
  ['ChillerEfficiency','emscard.name.chillerefficiency','col-md-6 col-lg-5 col-xl-4','fa-temperature-low'],
  ['WaterCost','emscard.name.watercost','col-md-6 col-lg-5 col-xl-4','fa-hand-holding-droplet'],
  ['GasUsageBar','emscard.name.gasusagebar','col-md-6 col-lg-7 col-xl-8','fa-chart-bar'],
  ['GasUsagePie','emscard.name.gasusagepie','col-md-6 col-lg-5 col-xl-4','fa-chart-pie'],
  ['GasCost','emscard.name.gascost','col-md-6 col-lg-5 col-xl-4','fa-fire'],
  ['CompressorEfficiency','emscard.name.compressorefficiency','col-md-6 col-lg-5 col-xl-4','fa-compress-arrows-alt']
];
var HIDDEN = { GasUsageBar: 1, GasUsagePie: 1, GasCost: 1, CompressorEfficiency: 1 };
window.__MOCK = {
  '/EmsCardSetting/api/cards': function () {
    return { cards: DEF.map(function (d) { return { cardKey: d[0], nameKey: d[1], gridCss: d[2], icon: d[3], isVisible: !HIDDEN[d[0]] }; }) };
  }
};
</script>
